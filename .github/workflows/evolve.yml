name: evolve

on:
  schedule:
    # Backup only. GitHub treats cron as best-effort and drops runs under load:
    # this fired every 3-6h in practice, not hourly. The `chain` job below is
    # what actually keeps the hourly cadence; cron restarts it if it ever breaks.
    - cron: '17 * * * *'
  workflow_dispatch:        # Allow manual trigger for testing
  push:
    paths:
      - 'command.txt'       # Commit command.txt after adding a secret to trigger immediately

permissions:
  contents: write           # Bot must commit evolved code and state files
  actions: write            # `chain` dispatches the next run

jobs:
  pulse:
    name: Hourly Pulse
    runs-on: ubuntu-latest
    timeout-minutes: 55     # Hard cap — must finish before next scheduled run
    concurrency:            # Two pulses must never push to main at once
      group: evolve-pulse
      cancel-in-progress: false

    env:
      # ── LLM keys (add at least one) ─────────────────────────────────────
      GLM_API_KEY:              ${{ secrets.GLM_API_KEY }}
      ATRIA_API_KEY:            ${{ secrets.ATRIA_API_KEY }}
      OPENROUTER_API_KEY:       ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
      CEREBRAS_API_KEY:         ${{ secrets.CEREBRAS_API_KEY }}
      GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}

      # ── Publishing (optional) ────────────────────────────────────────────
      DEV_TO_API_KEY:           ${{ secrets.DEV_TO_API_KEY }}

      # ── Read-only wallet balance reporting (optional) ────────────────────
      # Receive address only. There is no withdrawal or transfer code path.
      USDT_WALLET_ADDRESS:      ${{ secrets.USDT_WALLET_ADDRESS }}
      ETHERSCAN_API_KEY:        ${{ secrets.ETHERSCAN_API_KEY }}

      # ── GitHub meta ──────────────────────────────────────────────────────
      GITHUB_REPO: ${{ github.repository }}
      GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name  "E-Evolve Bot"
          git config user.email "evolve-bot@users.noreply.github.com"

      - name: Pull latest changes (prevent push conflicts)
        run: git pull --rebase origin main || true

      - name: Run hourly pulse
        run: python -m bot.main
        env:
          PYTHONUNBUFFERED: "1"

      - name: Push evolution review branches
        # Evolution proposals live on evolve/* branches and are NOT merged here.
        # Pushing makes the diff reviewable; merging stays a human action.
        run: |
          for b in $(git branch --list 'evolve/*' --format='%(refname:short)'); do
            git push origin "refs/heads/$b" && echo "Pushed review branch: $b" \
              || echo "Could not push $b — will retry next cycle."
          done

      - name: Push all bot commits
        run: |
          git push origin HEAD:main || (
            echo "Push failed — rebasing and retrying..." &&
            git pull --rebase origin main &&
            git push origin HEAD:main
          ) || echo "Push failed after retry. Changes will be pushed next cycle."

      - name: Prune review branches
        # Review branches accumulate forever otherwise: one per evolution
        # proposal, hourly. Two rules, because merging is optional —
        #   1. merged into main  → the proposal landed, the branch is a leftover
        #   2. older than RETENTION_DAYS → nobody reviewed it and the code it
        #      proposes has drifted; a stale diff is not a reviewable one
        # Never touches anything outside evolve/*, and keeps the newest
        # KEEP_NEWEST branches regardless of age so there is always something
        # to review after a quiet fortnight.
        env:
          RETENTION_DAYS: "14"
          KEEP_NEWEST: "5"
        run: |
          git fetch --prune origin '+refs/heads/evolve/*:refs/remotes/origin/evolve/*' || true

          cutoff=$(( $(date -u +%s) - RETENTION_DAYS * 86400 ))
          # Newest-first by commit date; the first KEEP_NEWEST are exempt from the age rule.
          mapfile -t branches < <(
            git for-each-ref --sort=-committerdate \
              --format='%(refname:short) %(committerdate:unix)' \
              'refs/remotes/origin/evolve/*'
          )

          doomed=()
          idx=0
          for entry in "${branches[@]}"; do
            ref="${entry%% *}"; ts="${entry##* }"
            short="${ref#origin/}"
            idx=$(( idx + 1 ))

            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "merged, pruning: $short"
              doomed+=(":refs/heads/$short")
              continue
            fi

            if [ "$idx" -le "$KEEP_NEWEST" ]; then
              echo "keeping (newest $KEEP_NEWEST): $short"
            elif [ "$ts" -lt "$cutoff" ]; then
              echo "stale (>${RETENTION_DAYS}d), pruning: $short"
              doomed+=(":refs/heads/$short")
            else
              echo "keeping (recent): $short"
            fi
          done

          if [ "${#doomed[@]}" -eq 0 ]; then
            echo "Nothing to prune."
          else
            git push origin "${doomed[@]}" \
              || echo "Prune push failed — will retry next cycle."
          fi

  chain:
    # Self-schedules the next pulse one hour after this one STARTED. Dispatch
    # via GITHUB_TOKEN is one of the few events that does start a workflow.
    # Skipped only when the owner cancels the run, so a failed pulse still
    # keeps the heartbeat alive.
    name: Schedule next pulse
    needs: pulse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INTERVAL_SECONDS: "3600"
    steps:
      - name: Wait for the hour, then dispatch
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions"
          started=$(gh api "$api/runs/$GITHUB_RUN_ID" --jq '.run_started_at')

          wait=$(( $(date -d "$started" +%s) + INTERVAL_SECONDS - $(date +%s) ))
          if [ "$wait" -gt 0 ]; then
            echo "Next pulse in ${wait}s"
            sleep "$wait"
          fi

          # A cron or manual run that started after us already owns the chain.
          # Dispatching too would double the cadence, permanently.
          newer=$(gh api "$api/workflows/evolve.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and .run_started_at > \"$started\")] | length")
          if [ "$newer" -gt 0 ]; then
            echo "A newer run exists ($newer); it will schedule the next pulse."
            exit 0
          fi

          gh workflow run evolve.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "Dispatched next pulse."
